# Run the whole D2F stack (API + Postgres) on any Linux box / VPS:
#   1. ssh into the server, clone/copy this backend/ folder
#   2. cp env.production.example .env  (edit secrets)
#   3. docker compose up -d --build
#   4. open http://<server-ip>:4000/health  (put Cloudflare/Nginx HTTPS in front later)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: d2f
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: d2f_shipping
    volumes:
      - d2f-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2f -d d2f_shipping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://d2f:${DB_PASSWORD}@db:5432/d2f_shipping
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  d2f-dbdata:
